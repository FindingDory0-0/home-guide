<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="color-scheme" content="light only">
<title>가족 문서</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:#fafafa;color:#1a1a1a;font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;padding:16px}
  .box{width:100%;max-width:340px;background:#fff;border:1px solid #e5e5e5;border-radius:16px;padding:28px 24px}
  h1{font-size:18px;margin:0 0 4px}
  p{font-size:13px;color:#888;margin:0 0 18px}
  input[type=password]{width:100%;font:inherit;font-size:16px;padding:11px 13px;border:1px solid #ccc;border-radius:10px;outline:none}
  input[type=password]:focus{border-color:#1a1a1a}
  label{display:flex;align-items:center;gap:8px;font-size:13px;color:#555;margin:12px 0 16px}
  button{width:100%;font:inherit;font-size:15px;font-weight:700;padding:11px;border:0;border-radius:10px;background:#1a1a1a;color:#fff;cursor:pointer}
  button:disabled{opacity:.6}
  .err{color:#d9480f;font-size:13px;min-height:18px;margin-top:10px}
  .hide{display:none}
</style>
</head>
<body>
<form class="box hide" id="f" autocomplete="off">
  <h1>가족 문서</h1>
  <p>비밀번호를 입력하세요.</p>
  <input type="password" id="pw" autocomplete="current-password" placeholder="비밀번호" required>
  <label><input type="checkbox" id="keep" checked> 이 기기에서 기억하기</label>
  <button id="go">열기</button>
  <div class="err" id="err"></div>
</form>
<script id="payload" type="application/json">__PAYLOAD__</script>
<script>
(async function(){
  const P = JSON.parse(document.getElementById('payload').textContent);
  const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const enc = u => btoa(String.fromCharCode(...new Uint8Array(u)));
  const KEY = 'guide-key';
  const form = document.getElementById('f'), err = document.getElementById('err'), go = document.getElementById('go');

  async function open(key){
    const pt = await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.iv) }, key, b64(P.ct));
    const html = new TextDecoder().decode(pt);
    // 잠금 화면 문서를 복호화한 문서로 통째로 교체
    const doc = new DOMParser().parseFromString(html, 'text/html');
    document.replaceChild(document.adoptNode(doc.documentElement), document.documentElement);
    window.scrollTo(0, 0);
  }

  // 저장된 키가 있으면 바로 열기
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch(e) {}
  if (saved) {
    try {
      const k = await crypto.subtle.importKey('raw', b64(saved), 'AES-GCM', false, ['decrypt']);
      await open(k); return;
    } catch(e) { try { localStorage.removeItem(KEY); } catch(_) {} }
  }
  form.classList.remove('hide');
  document.getElementById('pw').focus();

  form.addEventListener('submit', async ev => {
    ev.preventDefault();
    err.textContent = ''; go.disabled = true; go.textContent = '여는 중…';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(document.getElementById('pw').value.trim()), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name:'PBKDF2', hash:'SHA-256', salt:b64(P.salt), iterations:P.iter }, base, { name:'AES-GCM', length:256 }, true, ['decrypt']);
      await crypto.subtle.decrypt({ name:'AES-GCM', iv:b64(P.iv) }, key, b64(P.ct)); // 맞는 비밀번호인지 확인
      if (document.getElementById('keep').checked) {
        const raw = await crypto.subtle.exportKey('raw', key);
        try { localStorage.setItem(KEY, enc(raw)); } catch(e) {}
      }
      await open(key);
    } catch(e) {
      err.textContent = '비밀번호가 맞지 않습니다.';
      go.disabled = false; go.textContent = '열기';
    }
  });
})();
</script>
</body>
</html>
